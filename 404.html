<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — file not found</title>
  <meta name="robots" content="noindex">
  <script>
    (function () { try { var t = localStorage.getItem('pf-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <!--
    This page is self-contained on purpose: hosts show it for ANY missing URL, at any depth
    (/typo, /a/b/c …), and on GitHub Pages the site may live in a sub-folder (you.github.io/repo/).
    Linking ../assets/… would break in some of those cases, so the styles are inline and the
    script at the bottom finds the home folder before loading the fonts.
  -->
  <style>
    :root, [data-theme="dark"] { color-scheme: dark; --desk: #070B14; --dot: rgba(143,169,255,.16); --window: #0D1220; --chrome: #0A0F1B; --line: rgba(143,169,255,.14); --line-strong: rgba(143,169,255,.3); --fg: #FFFFFF; --muted: #C9D3E6; --ok: #28C840; --path: #8FA9FF; }
    [data-theme="light"] { color-scheme: light; --desk: #EEF2F9; --dot: rgba(47,91,234,.14); --window: #FFFFFF; --chrome: #F1F4FA; --line: #E1E7F1; --line-strong: #C9D3E6; --fg: #0F1B2D; --muted: #3F4A5C; --ok: #15803D; --path: #2F5BEA; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--desk); color: var(--muted); font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: "Space Mono", ui-monospace, Menlo, monospace; }
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px; background-image: radial-gradient(var(--dot) 1px, transparent 1.5px); background-size: 26px 26px; }
    .box { width: min(640px, 100%); border-radius: 14px; overflow: hidden; background: var(--window); border: 1px solid var(--line-strong); box-shadow: 0 40px 100px -40px rgba(0,0,0,.6); }
    .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--chrome); border-bottom: 1px solid var(--line); }
    .bar i { width: 12px; height: 12px; border-radius: 50%; }
    .body { padding: 22px 24px 26px; font-size: 14px; line-height: 1.9; }
    .code { font-size: 64px; font-weight: 700; color: var(--fg); line-height: 1; margin: 6px 0 10px; font-family: "Space Grotesk", system-ui, sans-serif; }
    .ok { color: var(--ok); } .path { color: var(--path); } .err { color: #F87171; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; margin-top: 18px; padding: 0 18px; border-radius: 8px; background: #2F5BEA; color: #FFFFFF; font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 600; font-size: 15px; text-decoration: none; }
    .btn:hover { filter: brightness(1.1); }
    .btn:focus-visible { outline: 2px solid var(--path); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="box">
      <div class="bar" aria-hidden="true"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
      <div class="body mono">
        <div><span class="ok">➜</span> <span class="path">~/portfolio</span> open this-page</div>
        <h1 class="code">404</h1>
        <div><span class="err">error:</span> file not found. It may have moved, or the link has a typo.</div>
        <a class="btn" href="/" data-home>cd ~ — back to README</a>
      </div>
    </div>
  </main>
  <script>
    // Find the site's home folder: "/" on a custom domain or you.github.io,
    // "/repo/" on a GitHub project site. We check whether /<first-folder>/data/portfolio.json exists.
    (function () {
      function use(base) {
        document.querySelectorAll('[data-home]').forEach(function (a) { a.href = base; });
        var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'assets/css/fonts.css';
        var ico = document.createElement('link'); ico.rel = 'icon'; ico.type = 'image/svg+xml'; ico.href = base + 'assets/favicon/favicon.svg';
        document.head.appendChild(css); document.head.appendChild(ico);
      }
      var first = location.pathname.split('/')[1];
      if (!first || !window.fetch) return use('/');
      fetch('/' + first + '/data/portfolio.json', { method: 'HEAD' })
        .then(function (r) { use(r.ok ? '/' + first + '/' : '/'); })
        .catch(function () { use('/'); });
    })();
  </script>
</body>
</html>
